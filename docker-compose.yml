version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: saas-postgres
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_dashboard
    ports:
      - '5432:5432'
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas -d saas_dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saas_postgres_data:
