name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests and build
    runs-on: ubuntu-latest
    env:
      # Prisma generate/build do not connect, but the schema requires the variable.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/saas_dashboard?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
      NEXTAUTH_SECRET: ci-nextauth-secret-0123456789abcdef012345
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
